# Optional PostgreSQL for a later RDS-shaped deploy.
# The local POC uses PGlite (Postgres in-process) with the same DDL in src/db/sql.ts.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: referlink
      POSTGRES_PASSWORD: referlink
      POSTGRES_DB: referlink
    ports:
      - "5432:5432"
    volumes:
      - referlink_pg:/var/lib/postgresql/data
volumes:
  referlink_pg:

# Low-cost single-host deploy: Next.js app + Postgres 16.
# Usage on the server:
#   cp deploy.env.example .env   # edit secrets and APP_URL
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Do not expose port 5432 publicly. App listens on host port 80.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: referlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: referlink
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U referlink -d referlink"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "80:3000"
    environment:
      DATABASE_URL: postgres://referlink:${POSTGRES_PASSWORD}@db:5432/referlink
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL}
      APP_ENV: ${APP_ENV:-demo}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
